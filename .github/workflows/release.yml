# Builds grid for every supported platform and attaches the archives to the
# GitHub release. Runs when a release is published; can also be started by
# hand (Actions → Release → Run workflow) to test the build, in which case the
# archives are kept as workflow artifacts instead.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  # Provenance attestations are signed with a short-lived OIDC token and
  # written to the repository's attestation store.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          # grid is pure Go, so every target cross-compiles from Linux.
          CGO_ENABLED: "0"
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          set -euo pipefail
          targets="
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
            freebsd/amd64
          "
          mkdir -p dist
          for target in $targets; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            name="grid_${VERSION}_${GOOS}_${GOARCH}"
            bin=grid
            [ "$GOOS" = windows ] && bin=grid.exe

            work="build/$name"
            mkdir -p "$work"
            go build -ldflags="-s -w" -trimpath -o "$work/$bin" ./cmd/grid
            cp README.md "$work/"

            if [ "$GOOS" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C build "$name"
            fi
            echo "built $name"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      # Records who built these files, from which commit and with which
      # workflow, so `gh attestation verify` can check a download later.
      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"

      - name: Keep as workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: grid-${{ github.sha }}
          path: dist/*
