<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 64" width="164" height="64" role="img" aria-label="grid">
  <style>
    .ink  { fill: #1f2328; }
    .dim  { fill: #8c959f; }
    .mark { fill: #e3a21a; }
    .rev  { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .dim { fill: #6e7681; }
    }
  </style>

  <!-- Column separators and header rule, the way grid lays out a table: no frame -->
  <rect class="ink" x="21" y="6" width="2" height="52"/>
  <rect class="ink" x="43" y="6" width="2" height="52"/>
  <rect class="ink" x="4" y="18" width="56" height="2"/>

  <!-- Header row -->
  <rect class="ink" x="5"  y="10" width="11" height="3"/>
  <rect class="ink" x="32" y="10" width="9"  height="3"/>
  <rect class="ink" x="47" y="10" width="10" height="3"/>

  <!-- Cursor as in -view -->
  <rect class="mark" x="23" y="29" width="20" height="9"/>

  <!-- Text left, numbers right-aligned -->
  <rect class="dim" x="5"  y="24" width="12" height="3"/>
  <rect class="dim" x="34" y="24" width="7"  height="3"/>
  <rect class="dim" x="47" y="24" width="9"  height="3"/>

  <rect class="dim" x="5"  y="32" width="8"  height="3"/>
  <rect class="rev" x="28" y="32" width="13" height="3"/>
  <rect class="dim" x="47" y="32" width="12" height="3"/>

  <rect class="dim" x="5"  y="40" width="14" height="3"/>
  <rect class="dim" x="36" y="40" width="5"  height="3"/>
  <rect class="dim" x="47" y="40" width="6"  height="3"/>

  <rect class="dim" x="5"  y="48" width="10" height="3"/>
  <rect class="dim" x="31" y="48" width="10" height="3"/>
  <rect class="dim" x="47" y="48" width="11" height="3"/>

  <text class="ink" x="72" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="600" letter-spacing="-1">grid</text>
</svg>
